<!DOCTYPE html>
<html lang="zh-Hant" data-size="std" data-theme="gold">
<head>

<style>
  :root{
    --bg:#0B0B0D; --card:#16161A; --card2:#1D1D23; --line:#2A2A32;
    --gold:#E8C15A; --gold-dim:#A98B3F; --text:#EDEAE0; --muted:#9C9889;
    --up:#FF5A5A; --down:#3DD68C; --bgt:rgba(11,11,13,.94);
  }
  html[data-theme="light"]{--bg:#F6F0E0;--card:#FFFFFF;--card2:#EFE7CF;--line:#DCD2B4;--gold:#7A5E17;--gold-dim:#9C8034;--text:#22381F;--muted:#5A6F58;--up:#C43D3D;--down:#1E7F4F;--bgt:rgba(246,240,224,.94);}
  html[data-theme="navy"]{--bg:#0C1322;--card:#141E33;--card2:#1B2946;--line:#263858;--gold:#9DC0FF;--gold-dim:#5C7FBF;--text:#E8EDF7;--muted:#8FA0BF;--up:#FF6B6B;--down:#43D69A;--bgt:rgba(12,19,34,.94);}
  html{font-size:17px;}
  html[data-size="lg"]{font-size:19px;}
  html[data-size="xl"]{font-size:22px;}
  html[data-size="elder"]{font-size:27px;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;line-height:1.7;}
  .wrap{max-width:1080px;margin:0 auto;padding:0 20px 60px;}
  header{padding:30px 0 8px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .logo{font-size:1.8rem;font-weight:900;color:var(--gold);letter-spacing:2px;}
  .logo small{font-size:.8rem;color:var(--muted);font-weight:400;letter-spacing:1px;margin-left:10px;}
  .applink{font-size:.8rem;color:var(--gold-dim);text-decoration:none;border:1px solid var(--gold-dim);border-radius:20px;padding:3px 14px;white-space:nowrap;}
  .applink:hover{color:var(--gold);border-color:var(--gold);}
  .head-right{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
  .fs-box{display:flex;gap:6px;align-items:center;}
  .fs-label{color:var(--muted);font-size:.75rem;}
  .fs-chip{cursor:pointer;border:1px solid var(--gold-dim);color:var(--gold-dim);background:none;
    border-radius:16px;padding:2px 12px;font-size:.8rem;font-family:inherit;}
  .fs-chip.on{background:var(--gold);color:var(--bg);border-color:var(--gold);font-weight:700;}
  .setwrap{position:relative;}
  .setbtn{cursor:pointer;border-radius:22px;border:1px solid var(--gold-dim);padding:8px 16px;
    background:var(--card);color:var(--gold);font-size:.95rem;font-weight:700;font-family:inherit;white-space:nowrap;}
  .setbtn:hover{border-color:var(--gold);}
  nav.pnav{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px;}
  nav.pnav a{color:var(--gold-dim);text-decoration:none;font-size:.9rem;font-weight:700;
    border:1px solid var(--gold-dim);border-radius:20px;padding:5px 16px;white-space:nowrap;}
  nav.pnav a.on{background:var(--gold);color:var(--bg);border-color:var(--gold);}
  nav.pnav a:hover{color:var(--gold);border-color:var(--gold);}
  nav.pnav a.on:hover{color:var(--bg);}
  .setpanel{position:absolute;right:0;top:54px;background:var(--card);border:1px solid var(--gold-dim);
    border-radius:12px;padding:12px 16px;display:none;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.45);white-space:nowrap;}
  .setpanel.open{display:block;}
  .setrow{display:flex;gap:6px;align-items:center;margin:6px 0;}
  .setrow>span{color:var(--muted);font-size:.75rem;margin-right:4px;}
  .notice{
    margin:16px 0 20px;padding:12px 18px;border:1px solid var(--gold-dim);
    background:linear-gradient(90deg,rgba(232,193,90,.10),rgba(232,193,90,.02));
    border-radius:8px;color:var(--gold);font-size:.95rem;font-weight:700;letter-spacing:.5px;
  }
  .notice span{color:var(--muted);font-weight:400;display:block;font-size:.8rem;margin-top:2px;}
  .searchbar{position:sticky;top:0;z-index:50;background:var(--bgt);backdrop-filter:blur(4px);
    padding:12px 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  #q{flex:1;min-width:220px;background:var(--card);border:1px solid var(--gold-dim);color:var(--text);
    border-radius:24px;padding:9px 18px;font-size:1rem;font-family:inherit;outline:none;}
  #q:focus{border-color:var(--gold);}
  .flt{cursor:pointer;border:1px solid var(--line);color:var(--muted);background:var(--card);
    border-radius:16px;padding:3px 14px;font-size:.82rem;font-family:inherit;}
  .flt.on{background:var(--gold);color:var(--bg);border-color:var(--gold);font-weight:700;}
  #count{color:var(--muted);font-size:.82rem;white-space:nowrap;}
  .rec{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin-bottom:10px;}
  .rec .top{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline;}
  .rec .d{color:var(--gold);font-weight:800;font-size:.9rem;white-space:nowrap;}
  .rec .stock{font-weight:700;font-size:1.02rem;}
  .rec .broker{color:var(--muted);font-size:.85rem;}
  .tag{display:inline-block;padding:1px 8px;border-radius:20px;font-size:.72rem;border:1px solid var(--gold-dim);color:var(--gold);white-space:nowrap;}
  .rec .rt{margin-top:4px;font-size:.9rem;}
  .rec .rt b{color:var(--gold);}
  .rec .note{color:var(--muted);font-size:.85rem;margin-top:5px;word-break:break-word;}
  .rec .note a{color:var(--gold-dim);text-decoration:none;border-bottom:1px dotted var(--gold-dim);}
  .rec .note a:hover{color:var(--gold);}
  .up{color:var(--up);font-weight:700;} .muted{color:var(--muted);}
  #more{display:block;margin:18px auto;background:none;border:1px solid var(--gold-dim);color:var(--gold);
    border-radius:24px;padding:8px 30px;font-size:.9rem;font-family:inherit;cursor:pointer;}
  #status{color:var(--muted);text-align:center;padding:30px 0;}
  footer{margin-top:44px;border-top:1px solid var(--line);padding-top:18px;color:var(--muted);font-size:.8rem;line-height:2;}
  footer b{color:var(--gold);}
  .thbtn{display:inline-flex;align-items:center;gap:8px;margin:2px 0 10px;padding:8px 18px;border:1px solid var(--gold-dim);
    border-radius:22px;color:var(--gold);text-decoration:none;font-weight:800;font-size:.9rem;background:var(--card);letter-spacing:1px;}
  .thbtn:hover{border-color:var(--gold);}
  .thbtn .at{font-size:1.1rem;font-weight:900;}
  @media (max-width:720px){
    .wrap{padding:0 12px 40px;}
    header{padding-top:16px;gap:8px;}
    .logo{font-size:1.4rem;}
    .applink{font-size:.72rem;padding:2px 10px;}
    .head-right{width:100%;flex-direction:row;justify-content:flex-end;align-items:center;}
    .rec{padding:12px 14px;}
    .setpanel{white-space:normal;min-width:250px;}
  }
  /* 強制手機版（設定 > 版面 > 手機版） */
  html.mob .wrap{padding:0 12px 40px;max-width:540px;}
  html.mob header{padding-top:16px;gap:8px;}
  html.mob .logo{font-size:1.4rem;}
  html.mob .head-right{width:100%;flex-direction:row;justify-content:flex-end;align-items:center;}
  html.mob .rec{padding:12px 14px;}
  html.mob .setpanel{white-space:normal;min-width:250px;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="logo">旺來<small>速查</small></div>
    <div class="head-right">
      <div class="setwrap">
        <button class="setbtn" id="setbtn" title="顯示設定">⚙ 設定</button>
        <div class="setpanel" id="setpanel">
          <div class="setrow"><span>字級</span>
            <button class="fs-chip" data-s="std">標準</button>
            <button class="fs-chip" data-s="lg">大</button>
            <button class="fs-chip" data-s="xl">特大</button>
            <button class="fs-chip" data-s="elder">我是長輩</button>
          </div>
          <div class="setrow"><span>主題</span>
            <button class="fs-chip" data-t="gold">黑金</button>
            <button class="fs-chip" data-t="light">米白</button>
            <button class="fs-chip" data-t="navy">深藍</button>
          </div>
          <div class="setrow"><span>版面</span>
            <button class="fs-chip" data-v="auto">自動</button>
            <button class="fs-chip" data-v="pc">電腦版</button>
            <button class="fs-chip" data-v="mb">手機版</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <div class="notice">
    ⚠ 本站為新聞整理用途
    <span>以下為工作流自公開新聞逐日收錄的券商觀點紀錄（含來源標註），僅供資訊參考，非投資建議；目標價與評等以各券商原始報告為準，著作權屬原媒體與原券商所有。</span>
  </div>

  <nav class="pnav">
    <a href="index.html">📰 每日情報站</a><a href="reports.html">📚 每日回顧</a><a href="stocks.html">🏢 個股報告</a><a class="on" href="records.html">🔎 速查</a>
  </nav>

  <div class="searchbar">
    <input id="q" type="search" placeholder="🔍 搜尋個股、代號、券商、產業、關鍵字…">
    <button class="flt on" data-f="">全部</button>
    <button class="flt" data-f="外資">外資</button>
    <button class="flt" data-f="內資">內資</button>
    <span id="count"></span>
  </div>

  <div id="list"><div id="status">資料載入中…</div></div>
  <button id="more" style="display:none;">載入更多</button>

  <footer>
    <a class="thbtn" href="https://www.threads.com/@wowwow31001" target="_blank" rel="noopener"><span class="at">＠</span>追蹤旺來的脆 wowwow31001</a><br>
    <b>旺來 @wowwow31001</b>｜本頁為新聞整理紀錄庫，內容彙整自公開新聞，非投資建議，不構成任何有價證券之買賣要約或訊號。<br>
    每筆紀錄之「來源」為引用出處；各報導著作權屬原媒體所有。資料由旺來研究報告工作流每日自動累積。
  </footer>

</div>
<script>
(function(){
  // ---- font size ----
  var KEY="wl_fs";
  function applyFs(s){
    document.documentElement.setAttribute("data-size", s);
    var chips=document.querySelectorAll(".fs-chip[data-s]");
    for(var i=0;i<chips.length;i++){chips[i].classList.toggle("on",chips[i].getAttribute("data-s")===s);}
  }
  var saved="std"; try{saved=localStorage.getItem(KEY)||"std";}catch(e){}
  applyFs(saved);
  var fsChips=document.querySelectorAll(".fs-chip[data-s]");
  for(var i=0;i<fsChips.length;i++){(function(b){b.addEventListener("click",function(){
    var s=b.getAttribute("data-s"); try{localStorage.setItem(KEY,s);}catch(e){} applyFs(s);
  });})(fsChips[i]);}

  // ---- theme ----
  var TK="wl_theme";
  function applyTh(t){
    document.documentElement.setAttribute("data-theme", t);
    var c=document.querySelectorAll(".fs-chip[data-t]");
    for(var i=0;i<c.length;i++){c[i].classList.toggle("on",c[i].getAttribute("data-t")===t);}
  }
  var st="gold"; try{st=localStorage.getItem(TK)||"gold";}catch(e){}
  applyTh(st);
  var thChips=document.querySelectorAll(".fs-chip[data-t]");
  for(var i=0;i<thChips.length;i++){(function(b){b.addEventListener("click",function(){
    var t=b.getAttribute("data-t"); try{localStorage.setItem(TK,t);}catch(e){} applyTh(t);
  });})(thChips[i]);}

  // ---- 版面切換（自動/電腦/手機） ----
  var VK="wl_view", vmeta=document.querySelector('meta[name="viewport"]');
  function applyV(v){
    if(vmeta) vmeta.setAttribute("content", v==="pc" ? "width=1100" : "width=device-width, initial-scale=1.0");
    document.documentElement.classList.toggle("mob", v==="mb");
    var c=document.querySelectorAll(".fs-chip[data-v]");
    for(var i=0;i<c.length;i++){c[i].classList.toggle("on", c[i].getAttribute("data-v")===v);}
  }
  var sv="auto"; try{sv=localStorage.getItem(VK)||"auto";}catch(e){}
  applyV(sv);
  var vwChips=document.querySelectorAll(".fs-chip[data-v]");
  for(var i=0;i<vwChips.length;i++){(function(b){b.addEventListener("click",function(){
    var v=b.getAttribute("data-v"); try{localStorage.setItem(VK,v);}catch(e){} applyV(v);
  });})(vwChips[i]);}

  // ---- 設定面板開關 ----
  var sb=document.getElementById("setbtn"), sp=document.getElementById("setpanel");
  if(sb&&sp){
    sb.addEventListener("click",function(e){e.stopPropagation();sp.classList.toggle("open");});
    sp.addEventListener("click",function(e){e.stopPropagation();});
    document.addEventListener("click",function(){sp.classList.remove("open");});
  }

  // ---- CSV parser (handles quoted fields with commas/newlines) ----
  function parseCSV(text){
    var rows=[],row=[],cur="",inQ=false;
    for(var i=0;i<text.length;i++){
      var c=text[i];
      if(inQ){
        if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else inQ=false; }
        else cur+=c;
      }else{
        if(c==='"') inQ=true;
        else if(c===','){row.push(cur);cur="";}
        else if(c==='\n'){row.push(cur);cur="";if(row.length>1||row[0]!=="")rows.push(row);row=[];}
        else if(c!=='\r') cur+=c;
      }
    }
    if(cur!==""||row.length){row.push(cur);rows.push(row);}
    return rows;
  }
  function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
  function linkify(s){
    s=esc(s);
    s=s.replace(/https?:\/\/[^\s"'）)]+/g,function(u){return '<a href="'+u+'" target="_blank" rel="noopener">'+u+'</a>';});
    s=s.replace(/money\.udn\s+(\d{7})/g,'<a href="https://money.udn.com/money/story/5607/$1" target="_blank" rel="noopener">money.udn $1</a>');
    s=s.replace(/ctee\s+(\d{11,}-\d{6})/g,'<a href="https://www.ctee.com.tw/news/$1" target="_blank" rel="noopener">ctee $1</a>');
    s=s.replace(/cnyes(?:\s+id)?\s+(\d{7})/g,'<a href="https://news.cnyes.com/news/id/$1" target="_blank" rel="noopener">cnyes $1</a>');
    return s;
  }

  var ALL=[], shown=0, PAGE=50, curF="", curQ="";
  var list=document.getElementById("list"), more=document.getElementById("more"), count=document.getElementById("count");

  function filtered(){
    var q=curQ.toLowerCase();
    return ALL.filter(function(r){
      if(curF && r.type.indexOf(curF)<0) return false;
      if(!q) return true;
      return (r.date+" "+r.broker+" "+r.type+" "+r.stock+" "+r.industry+" "+r.rating+" "+r.tp+" "+r.note).toLowerCase().indexOf(q)>=0;
    });
  }
  function render(reset){
    if(reset){list.innerHTML="";shown=0;}
    var rows=filtered();
    count.textContent="共 "+rows.length+" 筆";
    var end=Math.min(shown+PAGE,rows.length), html="";
    for(var i=shown;i<end;i++){
      var r=rows[i];
      html+='<div class="rec"><div class="top">'
        +'<span class="d">'+esc(r.date)+'</span>'
        +(r.type?'<span class="tag">'+esc(r.type)+'</span>':'')
        +'<span class="stock">'+esc(r.stock)+'</span>'
        +'<span class="broker">'+esc(r.broker)+(r.industry?'｜'+esc(r.industry):'')+'</span></div>'
        +'<div class="rt">評等：<b>'+esc(r.rating||"—")+'</b>　目標價：<b>'+esc(r.tp||"—")+'</b></div>'
        +(r.note?'<div class="note">'+linkify(r.note)+'</div>':'')
        +'</div>';
    }
    list.insertAdjacentHTML("beforeend",html);
    shown=end;
    more.style.display = shown<rows.length ? "block" : "none";
    if(rows.length===0) list.innerHTML='<div id="status">沒有符合的紀錄</div>';
  }

  document.getElementById("q").addEventListener("input",function(e){curQ=e.target.value.trim();render(true);});
  // 支援 records.html?q=股名 直接帶入搜尋（個股報告頁跳過來用）
  try{
    var pq=new URLSearchParams(location.search).get("q");
    if(pq){curQ=pq.trim();document.getElementById("q").value=curQ;}
  }catch(e){}
  var flts=document.querySelectorAll(".flt");
  for(var j=0;j<flts.length;j++){(function(b){b.addEventListener("click",function(){
    for(var k=0;k<flts.length;k++)flts[k].classList.remove("on");
    b.classList.add("on"); curF=b.getAttribute("data-f"); render(true);
  });})(flts[j]);}
  more.addEventListener("click",function(){render(false);});

  fetch("reports.csv",{cache:"no-store"}).then(function(r){
    if(!r.ok) throw new Error(r.status);
    return r.text();
  }).then(function(t){
    var rows=parseCSV(t);
    for(var i=1;i<rows.length;i++){ // skip header
      var c=rows[i]; if(c.length<4) continue;
      // 內部工作筆記列不對外顯示（方法論/收件匣/補正紀錄類）
      if(((c[3]||"")+(c[1]||"")).indexOf("方法論")>=0) continue;
      if((c[3]||"").indexOf("收件匣")>=0) continue;
      ALL.push({date:c[0]||"",broker:c[1]||"",type:c[2]||"",stock:c[3]||"",industry:c[4]||"",rating:c[5]||"",tp:c[6]||"",note:c[7]||""});
    }
    ALL.reverse(); // newest last in file -> show newest first
    render(true);
  }).catch(function(e){
    list.innerHTML='<div id="status">資料檔尚未上傳（reports.csv）。請旺來大大執行「3_同步報告資料.bat」。</div>';
  });
})();
</script>
</body>
</html>
