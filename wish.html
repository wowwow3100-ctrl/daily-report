<!DOCTYPE html>
<html lang="zh-Hant" data-size="std" data-theme="gold">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旺來 許願池｜說出你想要的功能</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%F0%9F%8D%8D%3C/text%3E%3C/svg%3E">
<meta property="og:title" content="旺來 許願池｜想看什麼，寫下來">
<meta property="og:description" content="想多看哪檔個股、想要什麼功能？丟進許願池，旺來聽得到。">
<meta property="og:image" content="https://wowwow3100-ctrl.github.io/daily-report/login-logo.png">
<meta property="og:url" content="https://wowwow3100-ctrl.github.io/daily-report/wish.html">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<style>
  :root{
    --bg:#0B0B0D; --card:#16161A; --card2:#1D1D23; --line:#2A2A32;
    --gold:#E8C15A; --gold-dim:#A98B3F; --text:#EDEAE0; --muted:#9C9889;
    --up:#FF5A5A; --down:#3DD68C; --bgt:rgba(11,11,13,.94);
  }
  html[data-theme="light"]{--bg:#F6F0E0;--card:#FFFFFF;--card2:#EFE7CF;--line:#DCD2B4;--gold:#7A5E17;--gold-dim:#9C8034;--text:#22381F;--muted:#5A6F58;--up:#C43D3D;--down:#1E7F4F;--bgt:rgba(246,240,224,.94);}
  html[data-theme="navy"]{--bg:#0C1322;--card:#141E33;--card2:#1B2946;--line:#263858;--gold:#9DC0FF;--gold-dim:#5C7FBF;--text:#E8EDF7;--muted:#8FA0BF;--up:#FF6B6B;--down:#43D69A;--bgt:rgba(12,19,34,.94);}
  html{font-size:17px;}
  html[data-size="lg"]{font-size:19px;}
  html[data-size="xl"]{font-size:22px;}
  html[data-size="elder"]{font-size:27px;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;line-height:1.7;}
  .wrap{max-width:820px;margin:0 auto;padding:0 20px 60px;}
  header{padding:30px 0 8px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .logo{font-size:1.8rem;font-weight:900;color:var(--gold);letter-spacing:2px;}
  .logo small{font-size:.8rem;color:var(--muted);font-weight:400;letter-spacing:1px;margin-left:10px;}
  .head-right{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
  .fs-chip{cursor:pointer;border:1px solid var(--gold-dim);color:var(--gold-dim);background:none;
    border-radius:16px;padding:2px 12px;font-size:.8rem;font-family:inherit;}
  .fs-chip.on{background:var(--gold);color:var(--bg);border-color:var(--gold);font-weight:700;}
  .setwrap{position:relative;}
  .setbtn{cursor:pointer;border-radius:22px;border:1px solid var(--gold-dim);padding:8px 16px;
    background:var(--card);color:var(--gold);font-size:.95rem;font-weight:700;font-family:inherit;white-space:nowrap;}
  .setbtn:hover{border-color:var(--gold);}
  nav.pnav{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px;}
  nav.pnav a{color:var(--gold-dim);text-decoration:none;font-size:.9rem;font-weight:700;
    border:1px solid var(--gold-dim);border-radius:20px;padding:5px 16px;white-space:nowrap;}
  nav.pnav a.on{background:var(--gold);color:var(--bg);border-color:var(--gold);}
  nav.pnav a:hover{color:var(--gold);border-color:var(--gold);}
  nav.pnav a.on:hover{color:var(--bg);}
  .setpanel{position:absolute;right:0;top:54px;background:var(--card);border:1px solid var(--gold-dim);
    border-radius:12px;padding:12px 16px;display:none;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.45);white-space:nowrap;}
  .setpanel.open{display:block;}
  .setrow{display:flex;gap:6px;align-items:center;margin:6px 0;}
  .setrow>span{color:var(--muted);font-size:.75rem;margin-right:4px;}
  .notice{
    margin:16px 0 20px;padding:12px 18px;border:1px solid var(--gold-dim);
    background:linear-gradient(90deg,rgba(232,193,90,.10),rgba(232,193,90,.02));
    border-radius:8px;color:var(--gold);font-size:.95rem;font-weight:700;letter-spacing:.5px;
  }
  .notice span{color:var(--muted);font-weight:400;display:block;font-size:.8rem;margin-top:2px;}
  h2{font-size:1.2rem;color:var(--gold);letter-spacing:3px;margin:26px 0 14px;font-weight:800;}
  h2::before{content:"◆ ";color:var(--gold-dim);}
  /* --- 許願表單 --- */
  .wishbox{background:var(--card);border:1px solid var(--gold-dim);border-radius:14px;padding:20px 22px;
    background-image:radial-gradient(ellipse at 50% -20%,rgba(232,193,90,.12),transparent 60%);}
  .wishbox label{display:block;color:var(--muted);font-size:.8rem;margin:10px 0 4px;}
  #wname{width:100%;max-width:260px;background:var(--card2);border:1px solid var(--line);color:var(--text);
    border-radius:10px;padding:8px 14px;font-size:.95rem;font-family:inherit;outline:none;}
  #wmsg{width:100%;min-height:110px;background:var(--card2);border:1px solid var(--line);color:var(--text);
    border-radius:10px;padding:10px 14px;font-size:1rem;font-family:inherit;outline:none;resize:vertical;line-height:1.7;}
  #wname:focus,#wmsg:focus{border-color:var(--gold);}
  .wrow{display:flex;align-items:center;gap:14px;margin-top:14px;flex-wrap:wrap;}
  #wsend{cursor:pointer;border:none;border-radius:24px;padding:10px 32px;font-size:1rem;font-weight:900;
    font-family:inherit;background:var(--gold);color:var(--bg);letter-spacing:2px;}
  #wsend:disabled{opacity:.5;cursor:default;}
  #wcount{color:var(--muted);font-size:.78rem;}
  #wstat{font-size:.85rem;color:var(--gold);}
  #wstat.err{color:var(--up);}
  .hp{position:absolute;left:-9999px;top:-9999px;height:1px;width:1px;overflow:hidden;}
  /* --- 許願牆 --- */
  .wish{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 18px;margin-bottom:10px;}
  .wish .top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;}
  .wish .who{color:var(--gold);font-weight:800;font-size:.92rem;}
  .wish .when{color:var(--muted);font-size:.75rem;}
  .wish .msg{margin-top:3px;font-size:.95rem;word-break:break-word;white-space:pre-wrap;}
  #wstatus{color:var(--muted);text-align:center;padding:26px 0;}
  .wtotal{color:var(--muted);font-size:.8rem;margin:0 0 12px;}
  footer{margin-top:44px;border-top:1px solid var(--line);padding-top:18px;color:var(--muted);font-size:.8rem;line-height:2;}
  footer b{color:var(--gold);}
  .thbtn{display:inline-flex;align-items:center;gap:8px;margin:2px 0 10px;padding:8px 18px;border:1px solid var(--gold-dim);
    border-radius:22px;color:var(--gold);text-decoration:none;font-weight:800;font-size:.9rem;background:var(--card);letter-spacing:1px;}
  .thbtn:hover{border-color:var(--gold);}
  .thbtn .at{font-size:1.1rem;font-weight:900;}
  @media (max-width:720px){
    .wrap{padding:0 12px 40px;}
    header{padding-top:16px;gap:8px;}
    .logo{font-size:1.4rem;}
    .head-right{width:100%;flex-direction:row;justify-content:flex-end;align-items:center;}
    .wishbox{padding:16px 14px;}
    .setpanel{white-space:normal;min-width:250px;}
  }
  /* 強制手機版（設定 > 版面 > 手機版） */
  html.mob .wrap{padding:0 12px 40px;max-width:540px;}
  html.mob header{padding-top:16px;gap:8px;}
  html.mob .logo{font-size:1.4rem;}
  html.mob .head-right{width:100%;flex-direction:row;justify-content:flex-end;align-items:center;}
  html.mob .wishbox{padding:16px 14px;}
  html.mob .setpanel{white-space:normal;min-width:250px;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="logo">旺來<small>許願池</small></div>
    <div class="head-right">
      <div class="setwrap">
        <button class="setbtn" id="setbtn" title="顯示設定">⚙ 設定</button>
        <div class="setpanel" id="setpanel">
          <div class="setrow"><span>字級</span>
            <button class="fs-chip" data-s="std">標準</button>
            <button class="fs-chip" data-s="lg">大</button>
            <button class="fs-chip" data-s="xl">特大</button>
            <button class="fs-chip" data-s="elder">我是長輩</button>
          </div>
          <div class="setrow"><span>主題</span>
            <button class="fs-chip" data-t="gold">黑金</button>
            <button class="fs-chip" data-t="light">米白</button>
            <button class="fs-chip" data-t="navy">深藍</button>
          </div>
          <div class="setrow"><span>版面</span>
            <button class="fs-chip" data-v="auto">自動</button>
            <button class="fs-chip" data-v="pc">電腦版</button>
            <button class="fs-chip" data-v="mb">手機版</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <div class="notice">
    🌠 許願池 — 我要聽到使用者的聲音
    <span>想多看哪檔個股的整理、想要什麼新功能、哪裡看不順眼，都寫下來。願望會公開顯示在下面的許願牆，旺來會親自看每一則。</span>
  </div>

  <nav class="pnav">
    <a href="index.html">📰 每日情報站</a><a href="reports.html">📚 每日回顧</a><a href="stocks.html">🏢 個股報告</a><a href="records.html">🔎 速查</a><a class="on" href="wish.html">🌠 許願池</a>
  </nav>

  <div class="wishbox">
    <label for="wname">暱稱（可留空，會顯示成「匿名鳳梨」）</label>
    <input id="wname" maxlength="12" placeholder="匿名鳳梨">
    <label for="wmsg">你的願望（最多 200 字，不能放網址）</label>
    <textarea id="wmsg" maxlength="200" placeholder="例：希望多整理 2330 的外資觀點／希望大盤速覽加上櫃買指數…"></textarea>
    <input class="hp" id="website" name="website" tabindex="-1" autocomplete="off">
    <div class="wrow">
      <button id="wsend">🪙 丟進許願池</button>
      <span id="wcount">0 / 200</span>
      <span id="wstat"></span>
    </div>
  </div>

  <h2>許願牆</h2>
  <div class="wtotal" id="wtotal"></div>
  <div id="wall"><div id="wstatus">許願牆載入中…</div></div>

  <footer>
    <a class="thbtn" href="https://www.threads.com/@wowwow31001" target="_blank" rel="noopener"><span class="at">＠</span>追蹤旺來的脆 wowwow31001</a><br>
    <b>旺來 @wowwow31001</b>｜許願牆內容為訪客留言，僅代表留言者個人意見，與本站立場無關；本站保留下架不當留言的權利。<br>
    本站為新聞整理用途，非投資建議，不構成任何有價證券之買賣要約或訊號。
  </footer>

</div>
<script>
(function(){
  var KEY="wl_fs";
  function applyFs(s){
    document.documentElement.setAttribute("data-size", s);
    var chips=document.querySelectorAll(".fs-chip[data-s]");
    for(var i=0;i<chips.length;i++){chips[i].classList.toggle("on",chips[i].getAttribute("data-s")===s);}
  }
  var saved="std"; try{saved=localStorage.getItem(KEY)||"std";}catch(e){}
  applyFs(saved);
  var fsChips=document.querySelectorAll(".fs-chip[data-s]");
  for(var i=0;i<fsChips.length;i++){(function(b){b.addEventListener("click",function(){
    var s=b.getAttribute("data-s"); try{localStorage.setItem(KEY,s);}catch(e){} applyFs(s);
  });})(fsChips[i]);}

  // ---- theme ----
  var TK="wl_theme";
  function applyTh(t){
    document.documentElement.setAttribute("data-theme", t);
    var c=document.querySelectorAll(".fs-chip[data-t]");
    for(var i=0;i<c.length;i++){c[i].classList.toggle("on",c[i].getAttribute("data-t")===t);}
  }
  var st="gold"; try{st=localStorage.getItem(TK)||"gold";}catch(e){}
  applyTh(st);
  var thChips=document.querySelectorAll(".fs-chip[data-t]");
  for(var i=0;i<thChips.length;i++){(function(b){b.addEventListener("click",function(){
    var t=b.getAttribute("data-t"); try{localStorage.setItem(TK,t);}catch(e){} applyTh(t);
  });})(thChips[i]);}

  // ---- 版面切換（自動/電腦/手機） ----
  var VK="wl_view", vmeta=document.querySelector('meta[name="viewport"]');
  function applyV(v){
    if(vmeta) vmeta.setAttribute("content", v==="pc" ? "width=1100" : "width=device-width, initial-scale=1.0");
    document.documentElement.classList.toggle("mob", v==="mb");
    var c=document.querySelectorAll(".fs-chip[data-v]");
    for(var i=0;i<c.length;i++){c[i].classList.toggle("on", c[i].getAttribute("data-v")===v);}
  }
  var sv="auto"; try{sv=localStorage.getItem(VK)||"auto";}catch(e){}
  applyV(sv);
  var vwChips=document.querySelectorAll(".fs-chip[data-v]");
  for(var i=0;i<vwChips.length;i++){(function(b){b.addEventListener("click",function(){
    var v=b.getAttribute("data-v"); try{localStorage.setItem(VK,v);}catch(e){} applyV(v);
  });})(vwChips[i]);}

  // ---- 設定面板開關 ----
  var sb=document.getElementById("setbtn"), sp=document.getElementById("setpanel");
  if(sb&&sp){
    sb.addEventListener("click",function(e){e.stopPropagation();sp.classList.toggle("open");});
    sp.addEventListener("click",function(e){e.stopPropagation();});
    document.addEventListener("click",function(){sp.classList.remove("open");});
  }

  // ================= 許願池 =================
  var API="https://web-production-e1521.up.railway.app";
  var wall=document.getElementById("wall"), wstatus=document.getElementById("wstatus");
  var wtotal=document.getElementById("wtotal");
  var wname=document.getElementById("wname"), wmsg=document.getElementById("wmsg");
  var wsend=document.getElementById("wsend"), wstat=document.getElementById("wstat");
  var wcount=document.getElementById("wcount");

  // visitor id
  var vid="";
  try{
    vid=localStorage.getItem("wl_vid")||"";
    if(!vid){vid="v"+Date.now().toString(36)+Math.random().toString(36).slice(2,10);localStorage.setItem("wl_vid",vid);}
  }catch(e){}

  function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

  function renderWall(list, total){
    if(!list||!list.length){
      wall.innerHTML='<div id="wstatus">還沒有人許願，來當第一個吧。</div>';
      wtotal.textContent="";
      return;
    }
    var h="";
    for(var i=0;i<list.length;i++){
      var w=list[i];
      h+='<div class="wish"><div class="top"><span class="who">'+esc(w.name)+'</span><span class="when">'+esc(w.ts)+'</span></div>'
        +'<div class="msg">'+esc(w.message)+'</div></div>';
    }
    wall.innerHTML=h;
    wtotal.textContent=total?("目前累積 "+total+" 個願望"):"";
  }

  function loadWall(){
    fetch(API+"/api/wishes?limit=60")
      .then(function(r){return r.json();})
      .then(function(j){renderWall(j.wishes||[], j.total);})
      .catch(function(e){wall.innerHTML='<div id="wstatus">許願牆暫時連不上，稍後再試。</div>';});
  }
  loadWall();

  wmsg.addEventListener("input",function(){wcount.textContent=wmsg.value.length+" / 200";});

  wsend.addEventListener("click",function(){
    var msg=(wmsg.value||"").trim();
    wstat.className=""; wstat.textContent="";
    if(msg.length<2){wstat.className="err";wstat.textContent="願望太短了，多寫一點吧";return;}
    wsend.disabled=true; wstat.textContent="送出中…";
    fetch(API+"/api/wish",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({name:(wname.value||"").trim(),message:msg,visitor_id:vid,
        website:document.getElementById("website").value||""})
    }).then(function(r){
      if(r.ok){return {ok:true};}
      return r.json().then(function(j){throw new Error((j&&j.detail)||("送出失敗（"+r.status+"）"));});
    }).then(function(){
      wstat.textContent="✨ 願望已丟進池子！";
      wmsg.value=""; wcount.textContent="0 / 200";
      loadWall();
    }).catch(function(e){
      wstat.className="err"; wstat.textContent=e.message||"送出失敗，稍後再試";
    }).finally(function(){ wsend.disabled=false; });
  });
})();
</script>
</body>
</html>
