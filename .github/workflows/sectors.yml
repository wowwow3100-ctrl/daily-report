name: sectors-board
# 資金流向：交易日收盤後抓證交所類股漲跌與成分股，寫到 data 分支（不碰 main）
on:
  schedule:
    - cron: "40 6,7,9,12 * * 1-5"   # 台北 14:40 / 15:40 / 17:40 / 20:40
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sectors.yml"
      - "tools/fetch_sectors.py"
permissions:
  contents: write
concurrency:
  group: data-branch
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
      - name: Prepare data branch
        env:
          REPO: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          if git clone --depth 1 --branch data "$REPO" data; then
            echo "data branch exists"
          else
            mkdir data && cd data && git init -b data && git remote add origin "$REPO"
          fi
      - name: Fetch sectors
        run: python3 src/tools/fetch_sectors.py data/sectors
      - name: Commit
        run: |
          cd data
          git config user.name "wanglai-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "sectors $(date -u +%F_%H%M)"
            git pull --rebase origin data || true
            git push origin data
          fi
